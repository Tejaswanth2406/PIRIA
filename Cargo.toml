[package]
name = "piria"
version = "0.1.0"
edition = "2021"
authors = ["Piria Team <team@piria.rs>"]
description = "PIRIA MVP runtime core for distributed semantic graph intelligence."
license = "MIT"
repository = "https://example.com/piria"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.4", features = ["v7", "serde", "fast-rng"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
priority-queue = "1.2"
bitflags = { version = "1.3", features = ["serde"] }
thiserror = "1.0"
rand = { version = "0.8", features = ["std"] }
hex = "0.4"

[dev-dependencies]
serde_cbor = "0.11"
